<style>
body {
    margin: 0;
    background: #0f172a;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
}

/* ENCABEZADO */
.header {
    text-align: center;
    padding-top: 30px;
    animation: fadeDown 1s ease;
}

.header h1 {
    font-size: 40px;
    color: #00f0ff;
    text-shadow: 0 0 15px #00f0ff;
}

.header p {
    font-size: 18px;
    color: #cbd5f5;
}

/* CONTENEDOR */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 70vh;
    gap: 50px;
}

/* TARJETAS */
.card {
    background: #1e293b;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 250px;
    box-shadow: 0 0 20px #00f0ff50;
    
    animation: float 3s ease-in-out infinite;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px #00f0ff;
}

/* IMÁGEN */
.icon {
    width: 80px;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 10px #00f0ff);
}

/* BOTÓN */
.card a {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 20px;
    background: #00f0ff;
    color: black;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
}

/* ANIMACIONES */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
}

@keyframes fadeDown {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
